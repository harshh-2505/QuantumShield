# HAProxy edge (web parity fixture)
global
    ssl-default-bind-ciphers ECDHE+AESGCM:ECDHE+CHACHA20:!AESCCM8
    ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-curves X25519MLKEM768:X25519
    ssl-default-server-ciphers RC4-SHA:DES-CBC3-SHA
    ssl-default-server-curves P-256:P-384

frontend https
    bind :443 ssl crt /etc/haproxy/certs/edge-bundle.pem ciphers AES256-SHA256:ECDHE-RSA-AES256-SHA:@STRENGTH curves X25519:P-256 ssl-min-ver TLSv1.1
    default_backend app

backend app
    server app1 10.0.0.10:8443 ssl verify required ciphers ECDHE-RSA-AES128-SHA:kRSA+SHA1:!AESCCM8 ca-file /etc/haproxy/ca.pem
    server app2 10.0.0.11:8443 check

# Envoy gateway (web parity fixture)
static_resources:
  listeners:
  - name: ingress
    filter_chains:
    - transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: TLSv1_0
              tls_maximum_protocol_version: TLSv1_2
              ecdh_curves: [P-256, X25519]
              cipher_suites: [ECDHE-ECDSA-AES128-GCM-SHA256, "[ECDHE-RSA-AES128-GCM-SHA256|ECDHE-RSA-CHACHA20-POLY1305]", AES256-SHA]
            tls_certificates:
            - certificate_chain:
                filename: /etc/envoy/certs/gateway.crt
              private_key:
                filename: /etc/envoy/certs/gateway.key
  - name: internal
    filter_chains:
    - transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: TLSv1_3
              ecdh_curves: []
              ecdh_curves: X25519MLKEM768:X25519
              cipher_suites: ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305

# Legacy edge proxy (web parity fixture).  Referenced certificate files do not
# exist anywhere in the fixture tree, so the CLI and the browser see the same thing.
server {
    listen 443 ssl;
    server_name legacy-edge.example.com www.legacy-edge.example.com;

    ssl_certificate         /etc/nginx/certs/legacy-edge.crt;
    ssl_certificate_key     /etc/nginx/certs/legacy-edge.key;
    ssl_trusted_certificate /etc/nginx/certs/partner-ca.crt;
    ssl_protocols           TLSv1 TLSv1.1 TLSv1.2;
    ssl_ecdh_curve          secp384r1:prime256v1;
    ssl_ciphers             'kRSA+AESGCM:ECDHE+AESGCM:!AESCCM8:!aNULL:@STRENGTH';
    ssl_prefer_server_ciphers on;
    ssl_verify_client       optional;
    ssl_conf_command        SignatureAlgorithms ECDSA+SHA256:RSA-PSS+SHA256:rsa_pkcs1_sha1;

    location /upstream {
        proxy_ssl_protocols     TLSv1.2 TLSv1.3;
        proxy_ssl_ciphers       NULL-MD5:ECDHE-RSA-AES256-SHA384;
        proxy_ssl_conf_command  Groups x25519:secp256r1;
        proxy_pass https://10.0.0.20;
    }

    location /grpc {
        grpc_ssl_ciphers HIGH+aRSA:-kRSA:+AES256:!AESCCM8;
        grpc_pass grpcs://10.0.0.21;
    }
}

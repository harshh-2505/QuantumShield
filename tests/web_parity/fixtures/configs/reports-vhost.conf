# Apache httpd virtual host (web parity fixture)
<VirtualHost *:443>
    ServerName reports.example.org
    SSLEngine on
    SSLProtocol all -SSLv3 -TLSv1
    SSLCipherSuite ALL:!COMPLEMENTOFDEFAULT:!eNULL:!AESCCM8:-DHE:+CAMELLIA:@STRENGTH
    SSLCipherSuite TLSv1.3 TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    SSLProxyProtocol +TLSv1.2 +TLSv1.3
    SSLProxyCipherSuite DEFAULT:!kRSA:!SHA1
    SSLOpenSSLConfCmd Curves X25519:prime256v1
    SSLOpenSSLConfCmd Groups X25519MLKEM768:X25519
    SSLCertificateFile /etc/ssl/reports.example.org.crt
    SSLCACertificateFile /etc/ssl/partner-root.crt
</VirtualHost>

<VirtualHost *:8443>
    ServerName legacy-reports.example.org
    SSLEngine on
    SSLProtocol TLSv1.2
    SSLCipherSuite DEFAULT:kRSA:!AESCCM8:+AES128
</VirtualHost>

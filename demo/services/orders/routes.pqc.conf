# Plain HTTP to the sidecar's egress listeners on loopback; the sidecar adds
# hybrid ML-KEM mutual TLS with orders' workload identity.
location /api/payments/  { proxy_pass http://127.0.0.1:9001/api/payments/;  proxy_set_header Host payments; }
location /api/inventory/ { proxy_pass http://127.0.0.1:9002/api/inventory/; proxy_set_header Host inventory; }

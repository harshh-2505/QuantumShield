# orders: customer-facing API. Calls payments and inventory over TLS.
worker_processes 1;
events { worker_connections 256; }
http {
    access_log off;
    server {
        include /etc/nginx/runtime/listen.conf;
        server_name orders;

        ssl_certificate     /etc/nginx/pki/orders.crt;
        ssl_certificate_key /etc/nginx/pki/orders.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ecdh_curve      X25519:prime256v1;
        ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;

        default_type application/json;
        location = /health      { return 200 '{"service":"orders","ok":true}\n'; }
        location /api/orders    { return 200 '{"service":"orders","orders":[{"id":1001,"sku":"QS-42","qty":3}]}\n'; }

        # Service-to-service routes (classical TLS before migration,
        # local QuantumShield egress proxy after).
        include /etc/nginx/runtime/routes.conf;
    }
}

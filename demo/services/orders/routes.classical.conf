location /api/payments/  {
    proxy_pass https://payments:443/api/payments/;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_server_name on;
}
location /api/inventory/ {
    proxy_pass https://inventory:443/api/inventory/;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_server_name on;
}

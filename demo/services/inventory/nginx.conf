# inventory: legacy internal service that has not been touched in years.
worker_processes 1;
events { worker_connections 256; }
http {
    access_log off;
    server {
        include /etc/nginx/runtime/listen.conf;
        server_name inventory;

        ssl_certificate     /etc/nginx/pki/inventory.crt;
        ssl_certificate_key /etc/nginx/pki/inventory.key;
        ssl_protocols       TLSv1 TLSv1.1 TLSv1.2;
        ssl_ecdh_curve      prime256v1:secp384r1;
        ssl_ciphers         AES128-GCM-SHA256:AES256-SHA:ECDHE-RSA-AES128-GCM-SHA256:DES-CBC3-SHA:@SECLEVEL=0;

        default_type application/json;
        location = /health        { return 200 '{"service":"inventory","ok":true}\n'; }
        location /api/inventory/  { return 200 '{"service":"inventory","sku":"QS-42","on_hand":118}\n'; }
    }
}

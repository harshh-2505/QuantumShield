# payments: internal service, card tokens and settlement data.
worker_processes 1;
events { worker_connections 256; }
http {
    access_log off;
    server {
        include /etc/nginx/runtime/listen.conf;
        server_name payments;

        ssl_certificate     /etc/nginx/pki/payments.crt;
        ssl_certificate_key /etc/nginx/pki/payments.key;
        ssl_protocols       TLSv1.2;
        ssl_ecdh_curve      prime256v1;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA;

        default_type application/json;
        location = /health       { return 200 '{"service":"payments","ok":true}\n'; }
        location /api/payments/  { return 200 '{"service":"payments","status":"authorised","token":"tok_4f9a","amount":129.99}\n'; }
    }
}

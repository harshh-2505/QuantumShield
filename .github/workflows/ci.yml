name: ci
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e '.[test]'
      - run: pytest -q
  pqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t quantumshield .
      - run: docker run --rm --entrypoint pytest quantumshield -q
      - run: docker run --rm --entrypoint quantumshield quantumshield bench local -n 20

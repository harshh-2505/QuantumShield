[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumshield"
version = "0.1.0"
description = "Post-quantum crypto-agility toolkit: CBOM scanner, migration planner and hybrid ML-KEM mTLS proxy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["cryptography>=43"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.18"]

[project.scripts]
quantumshield = "quantumshield.cli:main"
qs = "quantumshield.cli:main"

[tool.setuptools]
packages = ["quantumshield"]

[tool.setuptools.package-data]
quantumshield = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:ssl.TLSVersion:DeprecationWarning"]
